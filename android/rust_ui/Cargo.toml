[package]
name = "sharkos"
version = "0.1.0"
description = "SharkOS: A custom Android app to connect to an esp32 and manage sensor data."
authors = ["Jonathan Stoff <jonathanlstoff@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sharkos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
android_logger = "0.13"
base64 = "0.21"
csv = "1.3"
ndk = "0.9"
jni = "0.21"
tauri-plugin-log = "2"

# cryptography and radio algorithm helpers
crc = "2.1"
aes = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }

# async runtime (needed on all platforms for PostgreSQL + MQTT)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }

# PostgreSQL client (no TLS – plain TCP to local/trusted network)
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-only BLE crates (not compiled on Android)
btleplug = "0.9"
uuid = "1"


